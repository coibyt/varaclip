<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaraClip</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0B0F;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 20px;display:grid;place-items:center;font-size:40px;font-weight:800;color:#0B0B0F;background:linear-gradient(135deg,#FF4D8D,#F5C26B)}
  p{color:#A6A6B8;margin:6px 0}
  button{margin-top:20px;background:#FF4D8D;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div>
  <div class="logo">V</div>
  <h1>VaraClip</h1>
  <p>No connection. Check your internet and try again.</p>
  <p>Không có kết nối. Hãy kiểm tra mạng rồi thử lại.</p>
  <button onclick="location.reload()">↻</button>
</div>
</body>
</html>
